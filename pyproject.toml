[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esm2-phylogenomics"
version = "0.2.0"
description = "Alignment-free phylogenomics using ESM-2 protein language model embeddings"
requires-python = ">=3.10"
readme = "readme.md"

[tool.setuptools]
packages = ["esm2_phylo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
